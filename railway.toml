[build]
builder = "nixpacks"

[deploy]
startCommand = "node dist/enhanced-mcp-server.js"
healthcheckPath = "/"
healthcheckTimeout = 10
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "statecli-mcp"
internalPort = 4000

[services.healthcheck]
path = "/health"
interval = 30
timeout = 5
